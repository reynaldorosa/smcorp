# ============================================
# SMCORP - Docker Compose Production
# BANCO DE DADOS EXTERNO (sem PostgreSQL local)
# ============================================
# Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# ============================================

services:
  # ====================================
  # Backend NestJS (Production)
  # ====================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: smcorp_backend_prod
    restart: always
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      # --- Banco de Dados Externo ---
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL é obrigatória em produção}
      # --- JWT ---
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET é obrigatória em produção}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET é obrigatória em produção}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      # --- Criptografia (OBRIGATÓRIO em produção) ---
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY é obrigatória em produção}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:?ENCRYPTION_SALT é obrigatória em produção}
      # --- App ---
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN é obrigatória em produção}
      APP_URL: ${APP_URL:?APP_URL é obrigatória em produção — usada em links de certificado/matrícula}
      INSTITUTION_NAME: ${INSTITUTION_NAME:-SMCORP}
      # --- Mercado Pago (billing SaaS + PIX) ---
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET:-}
      MERCADO_PAGO_WEBHOOK_URL: ${MERCADO_PAGO_WEBHOOK_URL:-}
      # --- Uniq Suporte Connect (SMS/WhatsApp/Email) ---
      MESSAGING_API_URL: ${MESSAGING_API_URL:-https://connect.uniqsuporte.com.br}
      MESSAGING_API_KEY: ${MESSAGING_API_KEY:-}
      MESSAGING_API_KEY_HEADER: ${MESSAGING_API_KEY_HEADER:-Api-key}
      # --- Startup ---
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@smcorp.com.br}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MASTER_EMAIL: ${MASTER_EMAIL:-master@smcorp.com.br}
      MASTER_PASSWORD: ${MASTER_PASSWORD}
    expose:
      - "3001"
    networks:
      - smcorp_network
      - uniqsuporte
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ====================================
  # Frontend Next.js (Production)
  # ====================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-SMCORP}
        - NEXT_BUILD_IGNORE_LINT=${NEXT_BUILD_IGNORE_LINT:-true}
    container_name: smcorp_frontend_prod
    restart: always
    env_file:
      - .env.prod
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smcorp_network
      - uniqsuporte
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.30'
        reservations:
          memory: 128M
          cpus: '0.15'

networks:
  smcorp_network:
    driver: bridge
  uniqsuporte:
    external: true
    name: uniqsuporte
