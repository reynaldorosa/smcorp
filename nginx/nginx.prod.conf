# ============================================
# SMCORP - Nginx Production Config
# Reverse Proxy para Backend + Frontend
# ============================================
# TLS: este arquivo já está pronto para HTTPS, mas o CERTIFICADO em si
# precisa ser emitido no servidor real (precisa de DNS público apontando
# para este servidor + porta 80 acessível da internet — não dá para gerar
# isso a partir de uma máquina de desenvolvimento).
#
# Passo a passo no servidor de produção (Let's Encrypt via certbot, modo
# webroot — não derruba o nginx pra emitir/renovar):
#   1. mkdir -p /var/www/certbot
#   2. Suba o nginx primeiro só com o bloco :80 (este arquivo já serve o
#      desafio ACME em /.well-known/acme-challenge/ e redireciona o resto).
#   3. certbot certonly --webroot -w /var/www/certbot \
#        -d smcorp.uniqsolutions.com.br -d api-smcorp.uniqsolutions.com.br
#      (um único certificado cobrindo os dois domínios via SAN, já que este
#      nginx roteia por PATH — /api/ vs / — no mesmo server block)
#   4. Confirme que os arquivos existem em:
#        /etc/letsencrypt/live/smcorp.uniqsolutions.com.br/fullchain.pem
#        /etc/letsencrypt/live/smcorp.uniqsolutions.com.br/privkey.pem
#      (ajuste os caminhos abaixo se o certbot usar outro nome de diretório)
#   5. Recarregue o nginx (nginx -s reload) — o bloco :443 abaixo passa a
#      responder. Renovação automática: certbot já registra um timer/cron;
#      adicione `nginx -s reload` como deploy-hook para recarregar sem downtime.
# ============================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- Logging ----
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ---- Performance ----
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    # ---- Gzip ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # ---- Rate Limiting ----
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # ---- Upstreams ----
    upstream backend {
        server backend:3001;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    # ---- HTTP Server: só ACME challenge + redirect para HTTPS ----
    server {
        listen 80;
        server_name _;

        # Desafio do certbot (modo webroot) — precisa responder em HTTP puro,
        # por isso fica fora do redirect abaixo.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS Server (Production) ----
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Caminhos padrão do certbot — ajuste se o nome do diretório do
        # certificado for diferente (ex: se emitido só para um dos domínios).
        ssl_certificate     /etc/letsencrypt/live/smcorp.uniqsolutions.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/smcorp.uniqsolutions.com.br/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # ---- Security Headers ----
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:;" always;

        # ---- API Backend ----
        location /api/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Não cachear API
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # ---- Login Rate Limit mais restritivo ----
        location /api/v1/auth/login {
            limit_req zone=login burst=3 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # ---- Swagger ----
        # O backend já desabilita o Swagger por padrão quando NODE_ENV=production
        # (ver backend/src/main.ts — só monta em /api/docs se ENABLE_SWAGGER=true).
        # Este bloco existe apenas como segunda camada de defesa: se alguém
        # habilitar ENABLE_SWAGGER em produção, ainda bloqueia aqui na borda.
        location /api/docs {
            return 404;
        }

        # ---- Frontend Next.js ----
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Cache de assets estáticos
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                proxy_pass http://frontend;
                proxy_cache_valid 200 30d;
                add_header Cache-Control "public, max-age=2592000, immutable";
            }
        }

        # ---- Next.js Static Files ----
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # ---- Health Check ----
        location /nginx-health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # ---- Bloquear acesso a arquivos ocultos ----
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
